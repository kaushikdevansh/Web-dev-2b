<!DOCTYPE html>
<html>
<head>
    <title>Smart Event Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="heading">🎯 Smart Event Dashboard</h1>

    <div class="main">

        <div class="form-box">
            <h3>Add New Event</h3>

            <label>Event Title:</label>
            <input type="text">

            <label>Date:</label>
            <input type="date">

            <label>Category:</label>
            <select>
                <option>Conference</option>
                <option>Workshop</option>
                <option>Meeting</option>
            </select>

            <label>Description:</label>
            <textarea></textarea>

            <button>Add Event</button>
        </div>

        <div class="event-box">
            <h3>My Events</h3>

            <div class="buttons">
                <button class="btn">Clear All Events</button>
                <button class="btn">Add Sample Events</button>
            </div>

            <div class="card">
                <h4>Hackathon</h4>
                <p>10/2/2026</p>
                <span class="tag">College</span>
                <p>K.R. Mangalam University</p>
            </div>

        </div>

    </div>

    <div class="dom-box">
        <h3>DOM Manipulation Demo</h3>
        <p>innerHTML vs innerText vs textContent </p>
    </div>

</body>
</html>
